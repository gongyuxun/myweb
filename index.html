<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我制作的网站</title>
   </head>
<body>
   <div style="max-width: 800px; margin: 0 auto; padding: 20px; text-align: center;">
      <h1>PC工具箱</h1>
      <p>本网站由龚钰勋制作与维护</p>
   </div>
      <div style="display: flex; gap: 16px; justify-content: center; margin-top: 30px;">
            <span style="background: #f8a900; color: #000; padding: 12px 24px; border-radius: 30px; border: 1px solid #333; cursor: pointer;" onclick="switchTab('page1')">主板工具</span>
            <span style="background: #f8a900; color: #000; padding: 12px 24px; border-radius: 30px; border: 1px solid #333; cursor: pointer;" onclick="switchTab('page2')">超频工具</span>
            <span style="background: #f8a900; color: #000; padding: 12px 24px; border-radius: 30px; border: 1px solid #333; cursor: pointer;" onclick="switchTab('page3')">显卡工具</span>
            <span style="background: #f8a900; color: #000; padding: 12px 24px; border-radius: 30px; border: 1px solid #333; cursor: pointer;" onclick="switchTab('page4')">内存工具</span>
        </div>
     <div id="page1" style="max-width: 800px; margin: 20px auto; display: none; background: #1a1a1a; padding: 30px; border-radius: 16px; border: 1px solid #333; color: #e0e0e0;">
        <h2>主板工具</h2>
        <a href="https://www.asus.com" target="-blank">主板官网（华硕）</a>
    </div>

    <div id="page2" style="max-width: 800px; margin: 20px auto; display: none; background: #1a1a1a; padding: 30px; border-radius: 16px; border: 1px solid #333; color: #e0e0e0;">
        <h2>超频工具</h2>
        <p>开发中</p >
    </div>

    <div id="page3" style="max-width: 800px; margin: 20px auto; display: none; background: #1a1a1a; padding: 30px; border-radius: 16px; border: 1px solid #333; color: #e0e0e0;">
        <h2>显卡工具</h2>
        <p>超频/更改显卡，慎用</p >
        <a href="https://www.msi.cn/Landing/afterburner/graphics-cards" target="-blank">微星小飞机下载</a>
    </div>

    <div id="page4" style="max-width: 800px; margin: 20px auto; display: none; background: #1a1a1a; padding: 30px; border-radius: 16px; border: 1px solid #333; color: #e0e0e0;">
        <h2>内存工具</h2>
        <p>开发中</p >
    </div>

    <script>
        function switchTab(pageId) {
             document.querySelectorAll('#page1, #page2, #page3, #page4')
                .forEach(p => p.style.display = 'none');
            
            document.getElementById(pageId).style.display = 'block';
        }
    </script>

</body>
</html>
